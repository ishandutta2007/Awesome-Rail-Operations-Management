<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0c1626" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>

    <!-- Glowing Rail Neon Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#fda085" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f6d365" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="train-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="70%" stop-color="#00c6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes trackFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes signalBlink {
      0%, 100% { fill: #00ff88; filter: drop-shadow(0 0 6px #00ff88); }
      50% { fill: #008844; filter: none; }
    }
    @keyframes amberBlink {
      0%, 100% { fill: #ffb703; filter: drop-shadow(0 0 6px #ffb703); }
      50% { fill: #855700; filter: none; }
    }
    @keyframes trainGlide {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1300px); }
    }
    @keyframes pulseGrid {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.3; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .track-active {
      stroke-dasharray: 16, 8;
      animation: trackFlow 4s linear infinite;
    }
    .track-reverse {
      stroke-dasharray: 12, 6;
      animation: trackFlow 3s linear infinite reverse;
    }
    .signal-green { animation: signalBlink 2.5s ease-in-out infinite; }
    .signal-amber { animation: amberBlink 3.2s ease-in-out infinite; }
    .train-beam { animation: trainGlide 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .grid-lines { animation: pulseGrid 6s ease-in-out infinite; }
    .radar { transform-origin: 1050px 110px; animation: radarSweep 10s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Cyber Grid Lines -->
  <g class="grid-lines" stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Top Right Radar Graphic -->
  <g opacity="0.4">
    <circle cx="1050" cy="110" r="65" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="1050" cy="110" r="40" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1050" cy="110" r="18" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
    <line x1="985" y1="110" x2="1115" y2="110" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="1050" y1="45" x2="1050" y2="175" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />
    <line class="radar" x1="1050" y1="110" x2="1115" y2="110" stroke="#00ff88" stroke-width="2" filter="url(#soft-glow)" />
  </g>

  <!-- Railway Topology Geometric Network -->
  <!-- Main Line 1 -->
  <path d="M-50,290 L320,290 L520,220 L1250,220" fill="none" stroke="#1e3a8a" stroke-width="6" opacity="0.4" />
  <path class="track-active" d="M-50,290 L320,290 L520,220 L1250,220" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" />

  <!-- Main Line 2 -->
  <path d="M-50,320 L400,320 L620,260 L1250,260" fill="none" stroke="#374151" stroke-width="6" opacity="0.4" />
  <path class="track-reverse" d="M-50,320 L400,320 L620,260 L1250,260" fill="none" stroke="#38ef7d" stroke-width="2.5" filter="url(#glow)" />

  <!-- Siding / Freight Loop -->
  <path d="M250,290 L420,340 L880,340 L1020,260" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8, 6" opacity="0.75" filter="url(#soft-glow)" />

  <!-- Interlocking Switches & Junction Nodes -->
  <g fill="#ffffff" filter="url(#soft-glow)">
    <circle cx="320" cy="290" r="5" fill="#00f2fe" />
    <circle cx="520" cy="220" r="5" fill="#00f2fe" />
    <circle cx="400" cy="320" r="5" fill="#38ef7d" />
    <circle cx="620" cy="260" r="5" fill="#38ef7d" />
    <circle cx="250" cy="290" r="4" fill="#fbbf24" />
    <circle cx="880" cy="340" r="4" fill="#fbbf24" />
    <circle cx="1020" cy="260" r="4" fill="#fbbf24" />
  </g>

  <!-- High-Speed Dispatch Train Beam Animation -->
  <g class="train-beam">
    <line x1="-120" y1="220" x2="0" y2="220" stroke="url(#train-light)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="0" cy="220" r="4.5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Track Signals -->
  <g transform="translate(180, 248)">
    <rect x="-3" y="0" width="6" height="38" fill="#475569" rx="2" />
    <circle class="signal-green" cx="0" cy="6" r="5" />
    <circle cx="0" cy="18" r="4" fill="#1e293b" />
  </g>
  <g transform="translate(680, 180)">
    <rect x="-3" y="0" width="6" height="36" fill="#475569" rx="2" />
    <circle class="signal-green" cx="0" cy="6" r="5" />
    <circle class="signal-amber" cx="0" cy="18" r="5" />
  </g>
  <g transform="translate(940, 218)">
    <rect x="-3" y="0" width="6" height="38" fill="#475569" rx="2" />
    <circle class="signal-green" cx="0" cy="6" r="5" />
    <circle cx="0" cy="18" r="4" fill="#1e293b" />
  </g>

  <!-- Header Category Badge -->
  <g transform="translate(80, 52)">
    <rect x="0" y="0" width="265" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#00f2fe" filter="url(#soft-glow)" />
    <text x="28" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INTELLIGENT RAIL SYSTEMS</text>
  </g>

  <!-- Main Banner Title -->
  <text x="80" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
    Awesome Rail Operations Management
  </text>

  <!-- Subtitle / Value Proposition -->
  <text x="80" y="162" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.4">
    Dispatching • Timetabling • Capacity Simulation • Predictive Fleet Maintenance • TMS &amp; SCADA
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 186)">
    <g transform="translate(0, 0)">
      <rect width="132" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
      <text x="66" y="16" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Enterprise SaaS</text>
    </g>
    <g transform="translate(142, 0)">
      <rect width="144" height="24" rx="12" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
      <text x="72" y="16" fill="#d1fae5" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔓 Open-Source Tools</text>
    </g>
    <g transform="translate(296, 0)">
      <rect width="138" height="24" rx="12" fill="#b45309" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
      <text x="69" y="16" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 Star &amp; Price Metrics</text>
    </g>
  </g>
</svg>